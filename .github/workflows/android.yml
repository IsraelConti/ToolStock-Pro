name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, foodstock-control, maintenpro]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build embedded application
        run: |
          base64 --decode src/app-icon.b64 > src/app-icon.png
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            cp -f src/app-icon.png "$dir/ic_launcher.png"
            cp -f src/app-icon.png "$dir/ic_launcher_round.png"
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK and release bundle
        working-directory: android
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Sign MaintenPro Play bundle
        env:
          KEYSTORE_B64: ${{ secrets.MAINTENPRO_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MAINTENPRO_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAINTENPRO_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAINTENPRO_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          SRC="android/app/build/outputs/bundle/release/app-release.aab"
          OUT="android/app/build/outputs/bundle/release/MaintenPro-Play-signed.aab"
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::warning::MaintenPro signing secrets are not configured yet. Signed AAB will not be produced."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/maintenpro-upload.jks"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/maintenpro-upload.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$SRC" "${KEY_ALIAS:-upload}"
          cp "$SRC" "$OUT"
          jarsigner -verify -verbose -certs "$OUT"
          rm -f "$RUNNER_TEMP/maintenpro-upload.jks"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-AAB-signed
          path: android/app/build/outputs/bundle/release/MaintenPro-Play-signed.aab
          if-no-files-found: warn

      - name: Upload unsigned fallback bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-AAB-unsigned-fallback
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
