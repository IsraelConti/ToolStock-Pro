name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, foodstock-control, maintenpro]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build embedded application
        run: |
          base64 --decode src/app-icon.b64 > src/app-icon.png
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            cp -f src/app-icon.png "$dir/ic_launcher.png"
            cp -f src/app-icon.png "$dir/ic_launcher_round.png"
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK command line tools
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK, release APK and release bundle
        working-directory: android
        run: gradle --no-daemon clean assembleDebug assembleRelease bundleRelease

      - name: Sign MaintenPro Play bundle and Uptodown APK
        env:
          KEYSTORE_B64: ${{ secrets.MAINTENPROTOOLS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MAINTENPROTOOLS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAINTENPROTOOLS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MAINTENPROTOOLS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::warning::MaintenPro signing secrets are not configured. Signed AAB/APK will not be produced."
            exit 0
          fi

          KEYSTORE="$RUNNER_TEMP/maintenpro-upload.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          # Select the first private-key entry from the keystore; never print passwords or key material.
          SIGNING_ALIAS="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / { alias = $2 } /^Entry type: PrivateKeyEntry$/ { print alias; exit }')"
          if [ -z "$SIGNING_ALIAS" ]; then
            echo "::error::No private-key entry found in the MaintenPro keystore."
            keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / { alias = $2 } /^Entry type: / { print alias ": " $2 }'
            exit 1
          fi
          echo "Found a private-key entry in the MaintenPro keystore."

          # Sign AAB for Google Play
          AAB_SRC="android/app/build/outputs/bundle/release/app-release.aab"
          AAB_OUT="android/app/build/outputs/bundle/release/MaintenPro-Play-signed.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$KEYSTORE" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_SRC" "$SIGNING_ALIAS"
          cp "$AAB_SRC" "$AAB_OUT"
          jarsigner -verify -verbose -certs "$AAB_OUT"

          # Sign release APK for Uptodown / direct distribution
          APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="android/app/build/outputs/apk/release/MaintenPro-Uptodown-aligned.apk"
          APK_OUT="android/app/build/outputs/apk/release/MaintenPro-Uptodown-signed.apk"

          if [ ! -f "$APK_SRC" ]; then
            echo "::error::Release APK not found at $APK_SRC"
            find android/app/build/outputs/apk -maxdepth 3 -type f -print || true
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK_SRC" "$APK_ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$SIGNING_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_OUT" \
            "$APK_ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_OUT"
          rm -f "$APK_ALIGNED" "$KEYSTORE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed Uptodown APK
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-Uptodown-APK-signed
          path: android/app/build/outputs/apk/release/MaintenPro-Uptodown-signed.apk
          if-no-files-found: warn

      - name: Upload unsigned release APK fallback
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-Uptodown-APK-unsigned-fallback
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload signed Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-AAB-signed
          path: android/app/build/outputs/bundle/release/MaintenPro-Play-signed.aab
          if-no-files-found: warn

      - name: Upload unsigned fallback bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-AAB-unsigned-fallback
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
