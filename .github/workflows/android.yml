name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, toolstock-industrial, toolstock-owner-email]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build embedded application
        run: |
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK and release bundle
        working-directory: android
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Create ToolStock upload key and sign bundle
        run: |
          openssl rand -hex 24 > toolstock-upload.pass
          TOOLSTOCK_KEY_PASS="$(tr -d '\n' < toolstock-upload.pass)"
          keytool -genkeypair -v             -keystore toolstock-upload-key.jks             -storepass "$TOOLSTOCK_KEY_PASS"             -keypass "$TOOLSTOCK_KEY_PASS"             -alias toolstock-upload             -keyalg RSA -keysize 4096 -validity 10000             -dname "CN=ToolStock Pro, OU=Android, O=Israel Continente, L=Estepa, ST=Sevilla, C=ES"
          jarsigner             -keystore toolstock-upload-key.jks             -storepass "$TOOLSTOCK_KEY_PASS"             -keypass "$TOOLSTOCK_KEY_PASS"             -sigalg SHA256withRSA -digestalg SHA-256             android/app/build/outputs/bundle/release/app-release.aab             toolstock-upload
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
          keytool -exportcert -rfc             -keystore toolstock-upload-key.jks             -storepass "$TOOLSTOCK_KEY_PASS"             -alias toolstock-upload             -file toolstock-upload-certificate.pem

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ToolStock-Pro-Industrial-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed Play Store bundle and upload key
        uses: actions/upload-artifact@v4
        with:
          name: ToolStock-Pro-1.4.0-PLAY-STORE-FIRMADO
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            toolstock-upload-key.jks
            toolstock-upload.pass
            toolstock-upload-certificate.pem
          if-no-files-found: error
