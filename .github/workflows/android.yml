name: Build MaintenPro Tools

on:
  workflow_dispatch:
  push:
    branches: [maintenpro-tools]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build embedded application
        run: |
          base64 --decode src/app-icon.b64 > src/app-icon.png
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            cp -f src/app-icon.png "$dir/ic_launcher.png"
            cp -f src/app-icon.png "$dir/ic_launcher_round.png"
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile APKs
        working-directory: android
        run: gradle --no-daemon clean assembleDebug assembleRelease

      - name: Sign MaintenPro Tools APK
        env:
          KEYSTORE_B64: ${{ secrets.MAINTENPROTOOLS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MAINTENPROTOOLS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MAINTENPROTOOLS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::MaintenPro Tools signing secrets are not configured."
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/maintenpro-tools.jks"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="android/app/build/outputs/apk/release/MaintenPro-Tools-aligned.apk"
          APK_OUT="android/app/build/outputs/apk/release/MaintenPro-Tools-Uptodown-signed.apk"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK_SRC" "$APK_ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "maintenprotools" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$APK_OUT" \
            "$APK_ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_OUT"
          rm -f "$APK_ALIGNED" "$KEYSTORE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-Tools-APK-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Uptodown APK
        uses: actions/upload-artifact@v4
        with:
          name: MaintenPro-Tools-Uptodown-APK-signed
          path: android/app/build/outputs/apk/release/MaintenPro-Tools-Uptodown-signed.apk
          if-no-files-found: error
