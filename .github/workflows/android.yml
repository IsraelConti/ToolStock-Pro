name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, toolstock-industrial]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build embedded application
        run: |
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK and release bundle
        working-directory: android
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Sign Play release with existing upload key
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.TOOLSTOCK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.TOOLSTOCK_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TOOLSTOCK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TOOLSTOCK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::warning::ToolStock upload-key secrets are missing; only an unsigned bundle will be available."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/toolstock-upload.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          jarsigner -keystore "$KEYSTORE" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD \
            -signedjar android/app/build/outputs/bundle/release/ToolStock-Pro-Play-signed.aab \
            android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/ToolStock-Pro-Play-signed.aab
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload signed Play bundle
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ToolStock-Pro-PLAY-signed
          path: android/app/build/outputs/bundle/release/ToolStock-Pro-Play-signed.aab
          if-no-files-found: error

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ToolStock-Pro-Industrial-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: ToolStock-Pro-Industrial-AAB-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
