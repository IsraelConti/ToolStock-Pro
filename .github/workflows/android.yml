name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main, toolstock-industrial]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build embedded application
        run: |
          npm run build
          mkdir -p android/app/src/main/assets
          cp -f dist/* android/app/src/main/assets/

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          test -d "${ANDROID_SDK_ROOT}/platforms/android-36"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug APK and release bundle
        working-directory: android
        run: gradle --no-daemon clean assembleDebug bundleRelease

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ToolStock-Pro-Industrial-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: ToolStock-Pro-Industrial-AAB-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
